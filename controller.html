<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2c7a4c">
<title>Club · Warringah Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
html,body{height:100%}
body{display:flex;flex-direction:column;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.top{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 6px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{font-size:24px}
.chip{font-size:13px;font-weight:600;border-radius:999px;padding:4px 12px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--fairway-soft);color:var(--fairway);border-color:transparent}
.chip.bad{background:var(--flag-soft);color:var(--flag);border-color:transparent}
.msg{padding:0 16px 8px;color:var(--muted);font-size:15px;min-height:1.5em}
main{flex:1;display:flex;flex-direction:column;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));gap:10px;min-height:0}
.start{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.start button{font-size:20px;padding:18px;border-radius:16px}
.start p{margin:0;color:var(--muted)}
.clubs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.clubs::-webkit-scrollbar{display:none}
.clubs button{flex:none;min-width:52px;padding:9px 10px;border-radius:10px;font-family:var(--display);font-size:18px;font-weight:700}
.clubs button[aria-pressed="true"]{background:var(--fairway);color:var(--fairway-ink);border-color:var(--fairway)}
.clubname{font-size:14px;color:var(--muted);margin-top:-2px}
.aimrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
.aimrow button{padding:12px 10px;font-size:17px;font-weight:600;touch-action:none}
.aimrow button.on{background:var(--fairway);color:var(--fairway-ink);border-color:var(--fairway)}
.pad{flex:1;border-radius:22px;border:2px solid var(--fairway);background:var(--fairway-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:none;text-align:center;transition:background .12s,transform .12s;min-height:220px}
.pad .big{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;color:var(--fairway)}
.pad .small{color:var(--muted);font-size:15px;max-width:26ch}
.pad.held{background:var(--fairway);transform:scale(.985)}
.pad.held .big,.pad.held .small{color:var(--fairway-ink)}
.pad.cal{border-color:var(--amber);background:var(--amber-soft)}
.pad.cal .big{color:var(--amber)}
.pad.cal.held{background:var(--amber)}
.pad.cal.held .big,.pad.cal.held .small{color:var(--bg)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.result{font-variant-numeric:tabular-nums}
.result .num{font-size:32px;font-weight:700;line-height:1}
.result .num small{font-size:16px;color:var(--muted);margin-left:2px}
.result .tag{font-size:13px;color:var(--muted)}
.live{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="top">
  <h1>Club</h1>
  <span class="chip" id="chip">Not linked</span>
</div>
<div class="msg" id="msg">Starting…</div>
<main>
  <section class="start" id="startView">
    <button class="primary" id="startBtn">Start</button>
    <p>Your phone will ask to use motion. Tap <b>Allow</b>. Keep this page open while you play.</p>
  </section>
  <div id="playView" hidden style="display:contents">
    <div class="clubs" id="clubs" role="group" aria-label="Choose a club"></div>
    <div class="clubname" id="clubName"></div>
    <div class="aimrow"><button id="aimL" aria-label="Aim left">◀ Aim</button><button id="mapB">Map</button><button id="aimR" aria-label="Aim right">Aim ▶</button></div>
    <section class="pad" id="pad" aria-label="Hold to swing">
      <div class="big" id="padBig">Hold here</div>
      <div class="small" id="padSmall">Keep your thumb on the pad and swing.</div>
    </section>
    <div class="foot">
      <div class="result"><div class="tag" id="lastTag">Last swing</div><div class="num" id="pw">–</div></div>
      <button id="calBtn">Set full swing</button>
    </div>
    <div class="live" id="live"></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script src="vendor/peerjs.min.js"></script>
<script>
(() => {
const VERSION = 6;
const $ = s => document.querySelector(s);
const hostId = decodeURIComponent((location.hash || '').slice(1)).replace(/[^a-z0-9-]/gi, '');
const device = /iPhone/.test(navigator.userAgent) ? 'iPhone' : /iPad/.test(navigator.userAgent) ? 'iPad' : /Android/.test(navigator.userAgent) ? 'Android phone' : 'this device';
const setMsg = t => { $('#msg').textContent = t; };
const chip = (t, k) => { const c = $('#chip'); c.textContent = t; c.className = 'chip' + (k ? ' ' + k : ''); };
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1800); }
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const CLUBS = [['Dr','Driver'],['3W','3 wood'],['5i','5 iron'],['7i','7 iron'],['9i','9 iron'],['PW','Pitching wedge'],['SW','Sand wedge'],['Pt','Putter']];
// Detection settings. Full swings: hands rotate hundreds of °/s. Putts: a few dozen.
const MODES = {
  full: {start: 300, end: 150, endHold: 80, minPeak: 450, floor: 350, wait: 500},
  putt: {start: 40, end: 20, endHold: 120, minPeak: 60, floor: 30, wait: 300}
};
let club = store.get('wgolf-club', 'Dr');
let full = store.get('wgolf-full', null);       // °/s of your 100% swing, set by calibration
let puttFull = store.get('wgolf-puttfull', null);
const FULL_DEFAULT = 1100, PUTT_DEFAULT = 300;  // from your first test session
let face0 = store.get('wgolf-face0', null);      // your 'straight' face reading, from the setup swings
let calibrating = null;                          // {mode, peaks: [], faces: []}
const mode = () => club === 'Pt' ? 'putt' : 'full';

setMsg(hostId ? 'Tap Start to link with the screen.' : 'No screen code. Scan the QR code on your Mac to link. You can still practise here.');
if (!window.isSecureContext) setMsg('Open this page from its https:// address, or motion will be blocked.');

// ---------- link ----------
let peer = null, conn = null, motionStatus = 'pending';
function send(m){ if (conn && conn.open) { try { conn.send(m); } catch {} } }
function hello(){
  send({t:'status', motion: motionStatus, device, v: VERSION});
  send({t:'club', club});
  send({t:'cal', full: full || FULL_DEFAULT, puttFull: puttFull || PUTT_DEFAULT, face0, set: {full: !!full, putt: !!puttFull, face: face0 != null}});
}
function link(){
  if (!hostId || typeof Peer === 'undefined') return;
  chip('Linking…');
  peer = new Peer({debug: 1});
  peer.on('open', connectNow);
  peer.on('error', e => {
    if (e.type === 'peer-unavailable'){ chip('Looking…'); setMsg('Looking for the screen. Keep the game or Swing Lab open on your Mac.'); clearTimeout(retryT); retryT = setTimeout(connectNow, 2500); }
    else if (['network','server-error','socket-error'].includes(e.type) && !(conn && conn.open)){ chip('Not linked', 'bad'); setMsg('No internet connection to the matchmaking server.'); }
  });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch {} });
}
// Reconnects by itself, so switching between the Swing Lab and the game on the Mac keeps the phone linked.
let retryT = 0;
function connectNow(){
  if (!peer || peer.destroyed || (conn && conn.open)) return;
  const c = peer.connect(hostId, {serialization: 'json'}); conn = c;
  c.on('open', () => { chip('Linked', 'ok'); hello(); });
  c.on('data', onScreen);
  c.on('close', () => { if (c !== conn) return; chip('Reconnecting…'); clearTimeout(retryT); retryT = setTimeout(connectNow, 1500); });
}
function onScreen(m){
  if (!m || typeof m !== 'object') return;
  if (m.t === 'ping') send({t:'pong', at: m.at});
  else if (m.t === 'club' && CLUBS.some(c => c[0] === m.club) && !calibrating && m.club !== club){ club = m.club; store.set('wgolf-club', club); renderClubs(); }
  else if (m.t === 'state' && typeof m.text === 'string') setMsg(m.text.slice(0, 120));
}

// ---------- clubs ----------
function renderClubs(){
  $('#clubs').innerHTML = CLUBS.map(([k]) => `<button data-club="${k}" aria-pressed="${k === club}">${k}</button>`).join('');
  $('#clubName').textContent = CLUBS.find(c => c[0] === club)[1] + (club === 'Pt' ? ' · soft stroke, like a real putt' : '');
  $('#calBtn').textContent = club === 'Pt' ? 'Set full putt' : 'Set full swing';
  $('#padSmall').textContent = calibrating ? calText() : club === 'Pt' ? 'Hold the pad and make a smooth putting stroke.' : 'Keep your thumb on the pad and swing.';
  $('#pad').classList.toggle('cal', !!calibrating);
}
$('#clubs').addEventListener('click', e => {
  const b = e.target.closest('button[data-club]'); if (!b || calibrating) return;
  club = b.dataset.club; store.set('wgolf-club', club); renderClubs(); send({t:'club', club});
  b.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
});

// ---------- calibration ----------
function calText(){ return calibrating.mode === 'putt'
  ? `Make your longest comfortable putting stroke. ${calibrating.peaks.length + 1} of 3.`
  : `Take a full, comfortable swing. ${calibrating.peaks.length + 1} of 3.`; }
$('#calBtn').onclick = () => {
  if (calibrating){ calibrating = null; renderClubs(); setMsg('Setup cancelled.'); send({t:'cal', cancelled: true}); return; }
  calibrating = {mode: mode(), peaks: [], faces: []};
  $('#calBtn').textContent = 'Cancel';
  setMsg(calibrating.mode === 'putt' ? 'Setting your full putt. These 3 strokes set 100% for the putter.' : 'Setting your full swing. Swing straight: these 3 set 100% power and what "straight" feels like.');
  send({t:'cal', step: 0, of: 3, mode: calibrating.mode});
  renderClubs(); $('#calBtn').textContent = 'Cancel';
};
function calSwing(peak, faceRaw){
  calibrating.peaks.push(peak); calibrating.faces.push(faceRaw);
  const n = calibrating.peaks.length;
  send({t:'cal', step: n, of: 3, mode: calibrating.mode, peak: Math.round(peak)});
  if (n < 3){ renderClubs(); $('#calBtn').textContent = 'Cancel'; return; }
  const med = [...calibrating.peaks].sort((a,b) => a-b)[1];
  if (calibrating.mode === 'putt'){ puttFull = Math.round(med); store.set('wgolf-puttfull', puttFull); }
  else { full = Math.round(med); store.set('wgolf-full', full);
    face0 = Math.round([...calibrating.faces].sort((a,b) => a-b)[1]); store.set('wgolf-face0', face0); }
  setMsg(calibrating.mode === 'putt' ? `Full putt set: ${puttFull} °/s.` : `Full swing set: ${full} °/s. A swing like that is 100% power.`);
  toast('Saved');
  calibrating = null; renderClubs(); hello();
}

// ---------- motion ----------
let gotMotion = false, rot = 0, lastT = 0, lastSend = 0;
let holding = false, active = false, peak = 0, t0 = 0, lowSince = 0, coolUntil = 0;

// ---------- face angle ----------
// From address (pad pressed) we track the phone's full 3D orientation by integrating the gyro.
// At impact (fastest moment) we rotate the "face" direction of the phone by that orientation,
// flatten it onto the ground using gravity measured at address, and measure how far it has
// turned left or right. That is where the clubface points, whatever path the swing took.
const D2R = Math.PI / 180;
const qmul = (a, b) => [a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3], a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2], a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1], a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]];
const qrot = (q, v) => { const r = qmul(qmul(q, [0, v[0], v[1], v[2]]), [q[0], -q[1], -q[2], -q[3]]); return [r[1], r[2], r[3]]; };
const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = v => { const n = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/n, v[1]/n, v[2]/n]; };
let q = [1, 0, 0, 0], gLP = [0, -9.8, 0], up = [0, 1, 0], faceAxis = [0, 0, 1], gammaSum = 0;
let faceAtPeak = 0, oldAtPeak = 0;
function addressNow(){
  q = [1, 0, 0, 0]; gammaSum = 0; up = norm(gLP);
  // the face direction is whichever side of the phone (across it, or out of the screen) is flattest at address
  faceAxis = Math.abs(up[0]) < Math.abs(up[2]) ? [1, 0, 0] : [0, 0, 1];
}
function faceNow(){
  const n0 = faceAxis, n1 = qrot(q, faceAxis);
  const flat = v => norm([v[0] - up[0]*dot(v, up), v[1] - up[1]*dot(v, up), v[2] - up[2]*dot(v, up)]);
  const a = flat(n0), b = flat(n1);
  return Math.atan2(dot(up, cross(a, b)), dot(a, b)) / D2R;
}

$('#startBtn').onclick = async () => {
  $('#startBtn').disabled = true;
  let perm = 'granted';
  try {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') perm = await DeviceMotionEvent.requestPermission();
  } catch (e) { perm = 'denied'; }
  if (perm !== 'granted'){
    motionStatus = 'denied'; link();
    setMsg('Motion access was refused. In Safari, tap "aA" → Website Settings, allow Motion & Orientation, then reload.');
    $('#startBtn').disabled = false; return;
  }
  window.addEventListener('devicemotion', onMotion);
  navigator.wakeLock?.request('screen').catch(() => {});
  $('#startView').hidden = true; $('#playView').hidden = false;
  renderClubs(); setMsg('Waiting for motion…'); link();
  setTimeout(() => {
    if (!gotMotion){ motionStatus = 'none'; send({t:'status', motion:'none', device, v: VERSION}); setMsg("This browser isn't giving motion data. Try Safari on iPhone or Chrome on Android."); }
  }, 2000);
};

function onMotion(e){
  const rr = e.rotationRate;
  if (!rr || (rr.alpha == null && rr.beta == null && rr.gamma == null)) return;
  const now = performance.now(), dt = lastT ? Math.min(0.1, (now - lastT) / 1000) : 0; lastT = now;
  const a = rr.alpha || 0, b = rr.beta || 0, g = rr.gamma || 0;
  rot = Math.hypot(a, b, g);
  if (!gotMotion){ gotMotion = true; motionStatus = 'ok'; send({t:'status', motion:'ok', device, v: VERSION}); setMsg(hostId ? 'Pick a club, hold the pad and swing.' : 'Hold the pad and swing. (Not linked to a screen.)'); }

  const acc = e.accelerationIncludingGravity;
  if (acc && acc.x != null && rot < 120) gLP = [gLP[0]*0.8 + acc.x*0.2, gLP[1]*0.8 + acc.y*0.2, gLP[2]*0.8 + acc.z*0.2];
  if (holding && dt){
    const w = [b*D2R, g*D2R, a*D2R], wn = Math.hypot(w[0], w[1], w[2]);
    if (wn){ const h = wn*dt/2, s = Math.sin(h)/wn; q = qmul(q, [Math.cos(h), w[0]*s, w[1]*s, w[2]*s]); const m = Math.hypot(...q); q = q.map(v => v/m); }
    gammaSum += g * dt;
  }

  const M = MODES[mode()];
  if (!active && holding && now > coolUntil && rot > M.start){ active = true; peak = rot; faceAtPeak = faceNow(); oldAtPeak = gammaSum; t0 = now; lowSince = 0; }
  if (active){
    if (rot > peak){ peak = rot; faceAtPeak = faceNow(); oldAtPeak = gammaSum; }
    if (rot < M.end){ if (!lowSince) lowSince = now; } else lowSince = 0;
    if ((lowSince && now - lowSince > M.endHold && now - t0 > 120) || now - t0 > 2500) finish(now);
  }
  if (now - lastSend > 40){ lastSend = now; send({t:'m', r: Math.round(rot), h: holding}); }
  $('#live').textContent = `Rotation ${Math.round(rot)} °/s${active ? ' · swinging' : ''} · version ${VERSION}`;
}

// A swing is a backswing, a pause at the top, then the faster downswing. Each burst
// ends at a pause; hold the fastest one briefly so the downswing can replace the backswing.
let pending = null, pendingTimer = 0;
function finish(now){
  active = false;
  const M = MODES[mode()];
  if (peak >= M.minPeak && (!pending || peak > pending.peak)) pending = {peak, face: faceAtPeak, old: oldAtPeak, dur: now - t0, mode: mode()};
  if (!pending) return;
  clearTimeout(pendingTimer);
  pendingTimer = setTimeout(() => { if (active) return; const p = pending; pending = null; if (p) shoot(p); }, M.wait);
}
function shoot(p){
  coolUntil = performance.now() + 600;
  try { navigator.vibrate?.(p.mode === 'putt' ? 25 : 60); } catch {}
  if (calibrating){ send({t:'swing', club, cal: true, putt: p.mode === 'putt', peak: Math.round(p.peak), faceRaw: Math.round(p.face), faceOld: Math.round(p.old), dur: Math.round(p.dur)}); calSwing(p.peak, p.face); return; }
  const M = MODES[p.mode], top = p.mode === 'putt' ? (puttFull || PUTT_DEFAULT) : (full || FULL_DEFAULT);
  const power = Math.max(0.02, Math.min(1, (p.peak - M.floor) / (top - M.floor)));
  const over = p.mode === 'full' && p.peak > top * 1.15;
  send({t:'swing', club, putt: p.mode === 'putt', power, over, peak: Math.round(p.peak), face: Math.round(Math.max(-120, Math.min(120, p.face - (p.mode === 'full' && face0 != null ? face0 : 0)))), faceRaw: Math.round(p.face), faceOld: Math.round(p.old), dur: Math.round(p.dur)});
  $('#lastTag').textContent = 'Last ' + (p.mode === 'putt' ? 'putt' : 'swing') + (over ? ' · overswing' : '');
  $('#pw').innerHTML = Math.round(power * 100) + '<small>%</small>';
  $('#padBig').textContent = over ? 'Overswing!' : power > 0.9 ? 'Pure' : power > 0.6 ? 'Nice' : power > 0.3 ? 'Steady' : 'Soft';
  setTimeout(() => { $('#padBig').textContent = holding ? (club === 'Pt' ? 'Putt!' : 'Swing!') : 'Hold here'; }, 1400);
}

// ---------- aim buttons ----------
function aimBtn(el, d){
  const on = e => { e.preventDefault(); el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch {} send({t:'aim', d, on: true}); };
  const off = () => { if (!el.classList.contains('on')) return; el.classList.remove('on'); send({t:'aim', d, on: false}); };
  el.addEventListener('pointerdown', on); ['pointerup','pointercancel','lostpointercapture'].forEach(ev => el.addEventListener(ev, off));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
aimBtn($('#aimL'), -1); aimBtn($('#aimR'), 1);
$('#mapB').onclick = () => send({t:'view'});

// ---------- hold pad ----------
const pad = $('#pad'); const pointers = new Set();
function setHold(on){
  if (on === holding) return;
  holding = on; pad.classList.toggle('held', on);
  if (on) addressNow();
  $('#padBig').textContent = on ? (club === 'Pt' ? 'Putt!' : 'Swing!') : 'Hold here';
  if (!on && active) finish(performance.now());
  send({t:'m', r: Math.round(rot), h: holding});
}
pad.addEventListener('pointerdown', e => { pointers.add(e.pointerId); try { pad.setPointerCapture(e.pointerId); } catch {} setHold(true); e.preventDefault(); });
['pointerup','pointercancel','lostpointercapture'].forEach(ev => pad.addEventListener(ev, e => { pointers.delete(e.pointerId); if (!pointers.size) setHold(false); }));
pad.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') navigator.wakeLock?.request('screen').catch(() => {}); else { pointers.clear(); setHold(false); } });
})();
</script>
</body>
</html>
